[build-system]
requires = ["hatchling", "skills-runner"]
build-backend = "hatchling.build"

[project]
name = "weather-skills"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "scripts"]

[tool.hatch.metadata.hooks.skills-runner]
cli = "weather-skills"

[tool.hatch.build.hooks.skills-runner]

# Runs after skills-runner: drops skills/*/tests from the wheel (hatch_build.py).
[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
    "pytest>=9",
    "numpy",
    "xarray",
    "zarr",
    "cftime",
    "geopandas>=1.0",
    "weather-skills-core>=0.2.0",
    # Skill-script imports exercised by per-skill tests (mocked network).
    "requests",
    "earthaccess",
    "dynamical-catalog==1.0.1",
    "gcsfs",
    "xarray-regrid",
    "openpyxl",
    "netcdf4",
    "pillow",
    "rasterio",
    "scipy",
]

[tool.uv.sources]
skills-runner = { git = "https://github.com/tescalada/skills-runner" }
# summarize-dim needs weather_skills_core.reduce (weather-skills-core PR #8); back to
# the dev branch once that merges, then PyPI for the merge to main.
weather-skills-core = { git = "https://github.com/weather-skills/weather-skills-core", branch = "reduce-module" }

[tool.pytest.ini_options]
testpaths = ["skills"]
python_files = ["test_*.py"]
pythonpath = ["tests"]
filterwarnings = [
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
    "ignore:Import\\(s\\) unavailable to set up matplotlib support",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
