[build-system]
requires = ["hatchling", "skills-runner"]
build-backend = "hatchling.build"

[project]
name = "weather-skills"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "scripts"]

[tool.hatch.metadata.hooks.skills-runner]
cli = "weather-skills"

[tool.hatch.build.hooks.skills-runner]

# Runs after skills-runner: drops skills/*/tests from the wheel (hatch_build.py).
[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
    "pytest>=9",
    "numpy",
    "xarray",
    "zarr",
    "cftime",
    "geopandas>=1.0",
    "weather-skills-core>=0.3.2",
    # Skill-script imports exercised by per-skill tests (mocked network).
    "requests",
    "earthaccess",
    "dynamical-catalog==1.0.1",
    "gcsfs",
    "xarray-regrid",
    "openpyxl",
    "netcdf4",
    "pillow",
    "rasterio",
    "scipy",
    # tests/oom: watches skill subprocess memory. No dask here: installing it
    # would switch every in-process skill test to dask-backed inputs.
    "psutil",
]

[tool.uv.sources]
skills-runner = { git = "https://github.com/tescalada/skills-runner" }

[tool.pytest.ini_options]
testpaths = ["skills"]
python_files = ["test_*.py"]
pythonpath = ["tests"]
filterwarnings = [
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
    "ignore:Import\\(s\\) unavailable to set up matplotlib support",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
