[definitions.sheerwater-spw-rainy-onset]
status = "canonical"
name = "Sheerwater suitable-planting-window rainy onset (Rhiza Research)"
source.citation = "rhiza-research/sheerwater, sheerwater/tasks/spw.py, rainy_onset_condition (MIT); used by the Kenya suitable-planting-window dashboard"
source.url = "https://github.com/rhiza-research/sheerwater/blob/main/sheerwater/tasks/spw.py"
source.checked = "2026-09-27"
time_basis = "rolling_daily"
trigger.window_days = 8
trigger.total_mm = 30.0
trigger.total_op = ">"
confirm.window_days = 11
confirm.total_mm = 40.0
confirm.total_op = ">"
confirm.after_days = 0
veto.mode = "none"
trigger.window_align = "forward"
unspecified_in_source = ["trigger.window_align"]
notes = "cond = (agg_precip_11d > 40) & (agg_precip_8d > 30), both windows starting on the same day. For ensembles Sheerwater takes the member fraction and optionally compares it with prob_threshold (0.6 in its signature); that probability step is not part of the definition. Window alignment (forward from the onset day vs trailing) is set by the caller-supplied agg_fn, not in spw.py; forward is the convention recorded here and should be confirmed with Rhiza. rainy_onset_no_drought_condition adds a no-drought check and is not registered here."

[definitions.sheerwater-spw-rainy-onset.tunable]
why = "Rhiza's operational choice, not an external institutional standard: the two accumulations may move near their published values; window lengths and the strict comparisons are kept as published."
"trigger.total_mm" = {min = 20.0, max = 40.0}
"confirm.total_mm" = {min = 30.0, max = 50.0}
fixed = ["time_basis", "trigger.window_days", "trigger.total_op", "confirm.window_days", "confirm.total_op", "confirm.after_days", "veto.mode"]

# ---- Rhiza's Sheerwater benchmark: the team's own implementations -------------------------
# sheerwater/interfaces/events.py (MIT). has_onset_conditions() evaluates each spell with
# above_threshold (np.digitize right=True: strictly greater) on a left-aligned rolling window,
# and shifts every later spell to start where the trigger window ends. A "sum" spell compares
# the window mean with threshold/agg_days, i.e. window sum > threshold.

[definitions.sheerwater-icpac-onset]
status = "canonical"
name = "Sheerwater ICPAC onset (icpac_onset)"
source.citation = "rhiza-research/sheerwater, sheerwater/interfaces/events.py, icpac_onset (MIT)"
source.url = "https://github.com/rhiza-research/sheerwater/blob/main/sheerwater/interfaces/events.py"
source.checked = "2026-09-27"
time_basis = "rolling_daily"
trigger.window_days = 3
trigger.total_mm = 21.0
trigger.total_op = ">"
confirm.window_days = 7
confirm.total_mm = 10.5
confirm.total_op = ">"
confirm.after_days = 3
veto.mode = "none"
unspecified_in_source = []
notes = "Differs from the ICPAC maproom example (icpac-onset: 20 mm / 3 days, no 7-day dry spell within 21 days): Sheerwater requires more than 21 mm in 3 days followed by more than 10.5 mm in the next 7 days."

[definitions.sheerwater-icpac-onset.tunable]
why = "Rhiza's operational ICPAC parameters; the two accumulations may move near their published values, windows and strict comparisons stay as implemented."
"trigger.total_mm" = {min = 15.0, max = 30.0}
"confirm.total_mm" = {min = 5.0, max = 20.0}
fixed = ["time_basis", "trigger.window_days", "trigger.total_op", "confirm.window_days", "confirm.total_op", "confirm.after_days", "veto.mode"]

