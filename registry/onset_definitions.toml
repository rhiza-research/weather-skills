source.checked = "2026-09-27"
time_basis = "rolling_daily"
trigger.window_days = 5
trigger.all_days_wet = true
trigger.wet_day_mm = 1.0
trigger.wet_day_op = ">="
trigger.threshold_kind = "per_cell_climatology"
