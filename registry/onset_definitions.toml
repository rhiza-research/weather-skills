"trigger.total_mm" = {min = 20.0, max = 60.0}
"confirm.total_mm" = {min = 2.0, max = 10.0}
fixed = ["time_basis", "trigger.window_days", "trigger.total_op", "confirm.window_days", "confirm.total_op", "confirm.after_days", "veto.mode"]
