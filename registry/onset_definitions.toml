source.url = "https://iridl.ldeo.columbia.edu/maproom/Agriculture/Historical_Onset/ICPAC_North_Onset.html"
source.checked = "2026-09-27"
time_basis = "rolling_daily"
trigger.window_days = 3
trigger.total_mm = 20.0
trigger.total_op = ">="
veto.mode = "consecutive_dry"
veto.dry_days = 7
veto.dry_day_mm = 1.0
veto.follow_days = 21
veto.follow_anchor = "run_start_after_trigger_start"
search.start = ["03-01"]
search.window_days = 60
unspecified_in_source = ["trigger.total_op", "veto.dry_day_mm", "veto.follow_anchor"]

[definitions.icpac-onset-north.tunable]
why = "Same adjustable maproom defaults and bounds as icpac-onset; the 1 March search start is what makes this variant, so it is fixed."
"trigger.total_mm" = {min = 10.0, max = 40.0}
"trigger.window_days" = {min = 3, max = 7}
"trigger.total_op" = {choices = [">=", ">"]}
"veto.dry_days" = {min = 5, max = 10}
"veto.dry_day_mm" = {min = 0.5, max = 2.0}
"veto.follow_days" = {choices = [21, 30]}
"search.window_days" = {min = 30, max = 90}
