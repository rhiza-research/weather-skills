[definitions.sheerwater-moron-robertson-onset]
status = "canonical"
name = "Sheerwater Moron-Robertson onset, simplified (moron_and_robertson_onset)"
source.citation = "rhiza-research/sheerwater, sheerwater/interfaces/events.py, moron_and_robertson_onset (MIT)"
source.url = "https://github.com/rhiza-research/sheerwater/blob/main/sheerwater/interfaces/events.py"
source.checked = "2026-09-27"
time_basis = "rolling_daily"
trigger.window_days = 5
trigger.total_mm = 38.0
trigger.total_op = ">"
confirm.window_days = 10
confirm.total_mm = 5.0
confirm.total_op = ">"
confirm.after_days = 5
veto.mode = "none"
unspecified_in_source = []
notes = "A simplification of moron-robertson-2014: one fixed 38 mm threshold instead of the per-cell climatological 5-day amount, no all-days-wet test, and 'next 10 days total more than 5 mm' instead of 'no 10-day window below 5 mm within 30 days'. Whether 38 mm is a calibration or a placeholder is not documented in the code."

[definitions.sheerwater-moron-robertson-onset.tunable]
